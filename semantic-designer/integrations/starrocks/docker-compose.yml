services:
  starrocks:
    image: starrocks/allin1-ubuntu:latest
    container_name: semantic-designer-starrocks
    ports:
      - "9030:9030"
      - "8030:8030"
      - "8040:8040"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
